<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edge AI Gateway</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <nav>
    <div class="logo">Edge AI <span>Gateway</span></div>

    <div class="session-section">
      <div class="session-label">Session</div>
      <div class="session-id-row">
        <input type="text" id="session-id" spellcheck="false" placeholder="session id">
        <button id="new-session" title="New session">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="conv-main">

    <div class="chat-toolbar">
      <span class="chat-toolbar-title">Assistant</span>
      <div class="toolbar-spacer"></div>
      <span id="status-pill" class="status-pill idle">Ready</span>
    </div>

    <div class="chat-box" id="chat-box">
      <div class="chat-empty">
        <strong>Edge AI Gateway</strong>
        Start a conversation below
      </div>
    </div>

    <div class="chat-input-wrap">
      <div class="chat-input-box">
        <textarea id="input" placeholder="Message the assistant…" rows="1"></textarea>
        <button class="chat-send-btn" id="send" title="Send (Enter)">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="chat-input-hint">Enter to send · Shift+Enter for newline</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
